<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly MIS Dashboard</title>
  <meta name="description" content="Upload the monthly Tally trial balance to produce the investor MIS: P&L, balance sheet, cash flow, ratios and analyst commentary.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="co" id="coName">Monthly MIS</span>
      <span class="sub">Monthly MIS · Investor dashboard</span>
    </div>
    <div class="controls" id="controls">
      <label>Financial year <select id="selFY"></select></label>
      <label>Month <select id="selMonth"></select></label>
      <label>Units
        <select id="selUnit">
          <option value="lakh">₹ lakh</option>
          <option value="crore">₹ crore</option>
          <option value="rupee">₹ (absolute)</option>
        </select>
      </label>
      <button class="btn btn-primary" id="btnUpload" title="Upload one or more Tally trial balance Excel files">⬆ Upload trial balance</button>
      <button class="btn btn-ghost" id="btnExcel" title="Download the full MIS pack as Excel">⬇ Excel pack</button>
      <button class="btn btn-ghost" id="btnPrint" title="Print or save the investor pack as PDF">⎙ PDF pack</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="summary" class="active">Executive summary</button>
    <button data-tab="pl">Profit &amp; loss</button>
    <button data-tab="bs">Balance sheet</button>
    <button data-tab="cf">Cash flow</button>
    <button data-tab="wc">Working capital &amp; ratios</button>
    <button data-tab="insights">Insights &amp; risks</button>
    <button data-tab="data">Data &amp; mapping</button>
  </nav>

  <div class="banner hidden" id="banner"></div>
  <main id="app"></main>

  <input type="file" id="fileInput" accept=".xls,.xlsx,.xlsm" multiple hidden>
  <input type="file" id="backupInput" accept=".json" hidden>
  <div class="drop-overlay" id="dropOverlay">Drop Tally trial balance files to add them</div>
  <div class="toast" id="toast"></div>

  <!-- Third-party libraries (pinned versions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Application -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/parser.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/insights.js"></script>
  <script src="assets/js/tables.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
